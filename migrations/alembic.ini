# A generic, single database configuration.

[alembic]
# Required when invoking the `alembic` CLI directly (instead of `flask db`).
# Path is relative to the directory from which `alembic` is run; we expect
# `alembic -c migrations/alembic.ini ...` to be run from the project root.
script_location = migrations

# Migration files are named `<rev>_<slug>.py` so they sort visually in the
# directory and the down-revision chain is obvious from file names.
file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
